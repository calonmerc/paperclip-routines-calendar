# Publish to npm when a GitHub release is published.
# Modeled on gauderp/paperclip-github-manager's publish.yml.
#
# Auth: npm trusted publishing (OIDC), so no secret is needed. One-time setup
# (a first manual publish, then linking this repo/workflow on npmjs.com) is
# in docs/RELEASING.md. Until that's done, the publish step fails.
# An NPM_TOKEN secret is an optional fallback (see the same doc); npm tries
# OIDC first.
#
# Release checklist: bump `version` in package.json AND src/manifest.ts
# (they must match), commit, then create a GitHub release tagged v<version>.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Check release tag matches package and manifest versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          manifest="$(grep -oP 'version:\s*"\K[^"]+' src/manifest.ts | head -1)"
          echo "tag=$tag package=$pkg manifest=$manifest"
          test "$tag" = "$pkg" && test "$pkg" = "$manifest"

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Trusted publishing needs npm >= 11.5.1 (Node 24 bundles 11.x).
      - name: Check npm version
        run: node -e "const [a,b,c]=process.argv[1].split('.').map(Number);if(a<11||(a===11&&(b<5||(b===5&&c<1))))throw new Error('npm '+process.argv[1]+' < 11.5.1')" "$(npm -v)"

      - run: npm publish --access public --provenance
        env:
          # Optional fallback; empty when the secret isn't set.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
